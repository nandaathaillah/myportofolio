<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - {{ name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="#profile" class="brand">{{ name }}</a>
            <nav>
                <nav>
                    <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
                    <a href="{% url 'main:show_experience' %}">Experience</a>
                    <a href="{% url 'main:show_awards' %}">Awards</a>
                    <a href="{% url 'main:show_skills' %}">Skills</a>
                </nav>
            </nav>
        </div>
    </header>

    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">My skills so far</p>
                <h1>Skills</h1>

                <div class="experience-grid">
                    {% for skill in skill_list %}
                        <article class="experience-card">
                            <h2>{{ skill.category }}</h2>
                            <p class="experience-description">
                                {{ skill.items }}
                            </p>
                        </article>
                    {% empty %}
                        <p class="empty-state">
                            No skills have been added yet.
                        </p>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
