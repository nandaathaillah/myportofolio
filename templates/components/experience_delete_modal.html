<button type="button" class="button button-danger" popovertarget="delete-experience-{{ experience.id }}">
    Delete Experience
</button>

<div id="delete-experience-{{ experience.id }}" class="project-delete-modal" popover="auto">
    <div class="project-delete-modal_content">
        <h2>Delete Experience?</h2>
        <p>Are you sure you want to delete <strong>{{ experience.title }}</strong>?</p>
        <div class="project-delete-modal_actions">
            <button type="button" class="button button-secondary" popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, delete</button>
            </form>
        </div>
    </div>
</div>
