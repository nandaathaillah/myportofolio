{% extends 'base.html' %}
{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <h1>Add New Skill</h1>
            <form method="POST" class="award-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <p class="form-error">{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endfor %}
                <button type="submit" class="button">Save Skill</button>
                <a href="{% url 'main:show_skills' %}" class="button button-secondary">Cancel</a>
            </form>
        </div>
    </section>
</main>
{% endblock %}
